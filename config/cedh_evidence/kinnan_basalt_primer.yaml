# Curated strategy material for the Kinnan Basalt pack.
#
# Authored and checked in, NOT scraped at generation time. The generation path
# does not call EDHREC, Reddit, Moxfield or any deck-hosting site; strategy
# material arrives here, through review, with its provenance attached.
#
# Every section below becomes one evidence chunk carrying this file's source,
# locator and date. Keep sections short: the evidence bounds in
# config/cedh.yaml truncate anything longer, and a truncated chunk is a chunk
# whose second half the model never saw.

title: "Kinnan, Bonder Prodigy — Basalt engine, authored notes"
source: "Sabermetrics curated strategy notes"
