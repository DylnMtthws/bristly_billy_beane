[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabermetrics"
version = "0.1.0"
description = "Sabermetrics for Magic — Commander/EDH deck optimization using LLM-driven reasoning"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "argon2-cffi",
    "click",
    "flask",
    "flask-limiter",
    "flask-login",
    "flask-wtf",
    "httpx",
    "mtg-parser",
    "mtgsdk",
    "numpy",
    "pandas",
    "pydantic>=2.0",
    "pyyaml",
    "sentence-transformers",
    "waitress",
]

[project.optional-dependencies]
# The Postgres driver for the live mtg_v1 adapters. An extra, not a dependency:
# the ordinary test suite runs against fixtures and must not need a database.
postgres = ["psycopg[binary]>=3.1"]

# Pinned exactly. These tools gate or report on CI, and an unpinned linter
# turns main red on someone else's release day with no change to this repo.
# Bump deliberately, not incidentally.
dev = [
    "black==26.5.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
    # Stubs for third-party libraries mypy would otherwise report as untyped.
    "types-PyYAML",
    "types-waitress",
    "types-WTForms",
]

[project.scripts]
sabermetrics = "sabermetrics.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# pandas ships no official stubs (pandas-stubs is third-party and lags).
# Scoped to this one module rather than a global ignore_missing_imports, so
# every other untyped import still surfaces instead of being silently swallowed.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# psycopg is an optional extra (the "postgres" group). It is imported lazily so
# the default test suite never needs it, which also means mypy will not find it
# in a default install. Scoped rather than global, so every other untyped import
# still surfaces.
[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true

# flask_login ships no py.typed marker.
[[tool.mypy.overrides]]
module = "flask_login.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Opt-in integration markers. Every test carrying one is skipped unless its
# dependency is configured, and none of them runs in the default suite.
markers = [
    "postgres: hits a live mtg_v1 Postgres (needs MTG_V1_DSN)",
    "model: hits the live model provider and spends money (needs HF_TOKEN)",
    "simulator: runs the commander_simulator binary (needs CEDH_SIMULATOR_BIN)",
]
