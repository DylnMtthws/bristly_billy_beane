name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require Astra approval on the current automation commit
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sdlc/')
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_PUBLISHER: ${{ vars.DISPATCHER_PUBLISHER }}
        run: |
          test -n "$REVIEW_PUBLISHER"
          gh api "repos/$GITHUB_REPOSITORY/commits/$REVIEW_SHA/statuses" \
            | jq --arg publisher "$REVIEW_PUBLISHER" -e \
              '[.[] | select(.context == "dispatcher/astra")][0] | .state == "success" and .creator.login == $publisher'

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,postgres,legacy]"

      - name: Lint (ruff)
        run: ruff check src tests scripts/release_control.py scripts/storage_control.py scripts/storage_remote.py

      - name: Format (black)
        run: black --check src tests scripts/release_control.py scripts/storage_control.py scripts/storage_remote.py

      - name: Types (mypy)
        run: mypy src

      # The gate. This one must pass.
      - name: Tests (pytest)
        env:
          # Verified: the suite passes with this unset, so nothing requires it.
          # It is set anyway as a guard -- a dummy value means a test that ever
          # does reach for the API fails loudly on a bad key instead of
          # depending on whatever happens to be in the runner's environment.
          ANTHROPIC_API_KEY: dummy-key-not-used-by-tests
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: [test, review]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build linux/amd64 image
        env:
          BUILD_SHA: ${{ github.sha }}
        run: docker build --platform linux/amd64 --build-arg "SABER_BUILD_SHA=$BUILD_SHA" --tag decklab-ci .

      - name: Enforce image size ceiling
        run: |
          size_bytes="$(docker image inspect decklab-ci --format '{{.Size}}')"
          test "$size_bytes" -lt 400000000
          echo "Image size: $size_bytes bytes"

      - name: Validate installed simulator result schema outside the checkout
        run: |
          docker run --rm --interactive --network none --workdir /tmp decklab-ci python -I - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.exceptions import ValidationError
          from sabermetrics.cedh.simulator import _http_result_validator

          payload = json.loads(Path("/app/fixtures/cedh/simulation/kinnan.json").read_text())
          payload.pop("_README")
          payload.pop("commander_keys")
          validator = _http_result_validator()
          validator.check_schema(validator.schema)
          validator.validate(payload)
          del payload["card_data"]
          try:
              validator.validate(payload)
          except ValidationError:
              pass
          else:
              raise AssertionError("Malformed result was accepted")
          print("Installed schema accepts a v3 result and rejects missing card_data from /tmp")
          PY

      - name: Validate installed password recovery with mock delivery
        run: >-
          docker run --rm --interactive --network none --workdir /tmp
          decklab-ci python -I - < scripts/smoke_password_recovery.py

      - name: Validate installed feedback widget with mock Linear delivery
        run: >-
          docker run --rm --interactive --network none --workdir /tmp
          decklab-ci python -I - < scripts/smoke_issue_feedback.py

      - name: Validate installed Deck Lab refactor
        # Refactor assets and persistence must work from the installed package.
        # Keep integrations offline and use a disposable database.
        # The following step runs with redesign enabled and dev mode disabled.
        run: >-
          docker run --rm --interactive --network none --workdir /tmp
          decklab-ci python -I - < scripts/smoke_deck_lab.py

      - name: Start HTTP container
        run: >-
          docker run --detach --name decklab-ci
          --tmpfs /data:rw,uid=1001,gid=1001
          --env SABER_AUTH_MODE=password
          --env SABER_SECRET_KEY=ci-only-not-a-secret
          --publish 127.0.0.1:8080:8080
          decklab-ci

      - name: Smoke health and login
        run: |
          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/login \
            | grep --quiet "Sign In"

      - name: Container logs
        if: always()
        run: docker logs decklab-ci

      - name: Remove container
        if: always()
        run: docker rm --force decklab-ci

      - name: Package the tested main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/release_control.py bundle --output release

      - name: Retain the exact release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
