name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID containing the tested release
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deck-lab-production-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == vars.RELEASE_OWNER && github.triggering_actor == vars.RELEASE_OWNER
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate CI provenance and the tested image
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python scripts/release_control.py prepare --run-id "$CI_RUN_ID" --output prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-release-${{ github.run_attempt }}
          path: prepared/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://dylnmtthws-decklab.fly.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-release-${{ github.run_attempt }}
          path: prepared
      - name: Install verified Fly CLI
        run: python scripts/release_control.py install-fly --output "$RUNNER_TEMP/fly"
      - name: Install pinned private backup client
        run: pip install -r scripts/storage-requirements.txt
      - name: Promote the verified image after owner approval
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLYCTL: ${{ runner.temp }}/fly/flyctl
          EXPECTED_MACHINE_ID: ${{ vars.EXPECTED_MACHINE_ID }}
          EXPECTED_VOLUME_ID: ${{ vars.EXPECTED_VOLUME_ID }}
          RELEASE_BOOTSTRAP_BASE_SHA: ${{ vars.RELEASE_BOOTSTRAP_BASE_SHA }}
          RELEASE_MAINTENANCE_BASE_SHA: ${{ vars.RELEASE_MAINTENANCE_BASE_SHA }}
          RELEASE_MAINTENANCE_HEAD_SHA: ${{ vars.RELEASE_MAINTENANCE_HEAD_SHA }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://fly.storage.tigris.dev
          AWS_REGION: auto
          BUCKET_NAME: decklab-production-backups-dylnmtthws
        run: python scripts/release_control.py deploy --output prepared
      - name: Retain release and recovery metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-receipt-${{ github.run_attempt }}
          path: prepared/deployment.json
          if-no-files-found: warn
          retention-days: 90
