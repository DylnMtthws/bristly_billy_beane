<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} &middot; Sabermetrics Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="nav">
        <a href="{{ url_for('admin.overview') }}" class="nav-brand">Sabermetrics Admin</a>
        <div class="nav-links">
            <a href="{{ url_for('admin.overview') }}">Overview</a>
            <a href="{{ url_for('admin.users') }}">Users</a>
            <a href="{{ url_for('main.index') }}">&larr; User site</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
