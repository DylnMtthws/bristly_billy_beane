{% set lo = (low if low is not none else 0) %}
{% set hi = (high if high is not none else 10) %}
{% set lo_text = '10+' if lo == 10 else lo %}
{% set hi_text = '10+' if hi == 10 else hi %}
<div class="dl-bound-range" style="--bound-lo: {{ lo }}; --bound-hi: {{ hi }};">
    <div class="dl-bound-head">
        <p class="dl-bound-selection"><output data-bound-selection>{{ lo_text }}–{{ hi_text }}</output></p>
        <button type="button" class="dl-bound-clear" data-bound-clear aria-label="Clear {{ legend|lower }} range">Clear</button>
    </div>
    <div class="dl-bound-slider">
        <div class="dl-bound-track" aria-hidden="true"><span class="dl-bound-fill"></span></div>
        <input class="dl-bound-min" data-bound-min type="range" name="{{ min_name }}" min="0" max="10" step="1" value="{{ lo }}" aria-valuemin="0" aria-valuemax="10" aria-valuetext="{{ lo_text }}" aria-label="Minimum {{ legend|lower }}">
        <input class="dl-bound-max" data-bound-max type="range" name="{{ max_name }}" min="0" max="10" step="1" value="{{ hi }}" aria-valuemin="0" aria-valuemax="10" aria-valuetext="{{ hi_text }}" aria-label="Maximum {{ legend|lower }}">
    </div>
    <div class="dl-bound-labels" aria-hidden="true"><span>0</span><span>5</span><span>10+</span></div>
    <p class="dl-filter-hint">Leave the full range to include all values. 10+ means 10 or more.</p>
</div>
